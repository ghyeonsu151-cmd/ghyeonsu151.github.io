<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>멋진 자기소개</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

  body {
    margin: 0;
    font-family: 'Roboto', sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  .intro-container {
    text-align: center;
    animation: fadeIn 2s ease forwards;
  }

  @keyframes fadeIn {
    0% {opacity: 0; transform: translateY(-50px);}
    100% {opacity: 1; transform: translateY(0);}
  }

  h1 {
    font-size: 3rem;
    margin-bottom: 10px;
    letter-spacing: 2px;
    animation: slideIn 1s ease forwards;
  }

  @keyframes slideIn {
    0% {opacity: 0; transform: translateX(-100px);}
    100% {opacity: 1; transform: translateX(0);}
  }

  h2 {
    font-size: 1.5rem;
    color: #a0c4ff;
    margin-bottom: 20px;
    animation: slideIn 1s ease 0.5s forwards;
    opacity: 0;
  }

  p {
    font-size: 1.1rem;
    color: #dbe7ff;
    margin-bottom: 30px;
    animation: fadeIn 1s ease 1s forwards;
    opacity: 0;
  }

  .btn {
    display: inline-block;
    padding: 15px 40px;
    background: #ff6f61;
    border-radius: 50px;
    color: white;
    font-weight: bold;
    text-decoration: none;
    transition: transform 0.3s, background 0.3s;
  }

  .btn:hover {
    background: #ff3b2e;
    transform: scale(1.1);
  }

  footer {
    position: absolute;
    bottom: 20px;
    font-size: 0.9rem;
    color: #a0c4ff;
    animation: fadeIn 1s ease 1.5s forwards;
    opacity: 0;
  }
</style>
</head>
<body>
  <div class="intro-container">
    <h1>안녕하세요! 저는 [당신 이름]</h1>
    <h2>웹 개발자 & 크리에이티브 러너</h2>
    <p>끊임없이 배우고 성장하며,  
       세상에 작은 변화를 만들어내고 싶습니다.</p>
    <a class="btn" href="mailto:your.email@example.com">연락하기</a>
  </div>
  <footer>&copy; 2025 [당신 이름]. All Rights Reserved.</footer>
</body>
</html>
